<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07070b" />
<title>Jarvis</title>
<style>
  :root { --gold:#d4a843; --ink:#07070b; --ivory:#f4efe4; --mute:#9a9284; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--ink); color:var(--ivory); font-family:"Avenir Next","Segoe UI",sans-serif; }
  body { overflow:hidden; }
  .stage { position:relative; height:100dvh; background:radial-gradient(520px 320px at 50% 42%, rgba(212,168,67,.16), transparent 70%), linear-gradient(180deg, #101018, #07070b 70%); }
  .stage:before { content:""; position:absolute; inset:0; background-image:linear-gradient(rgba(212,168,67,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(212,168,67,.05) 1px, transparent 1px); background-size:42px 42px; mask-image:radial-gradient(circle at 50% 40%, #000 20%, transparent 75%); pointer-events:none; }
  header { position:absolute; top:16px; left:16px; right:16px; z-index:5; display:flex; justify-content:space-between; }
  .mark { letter-spacing:.32em; font-size:12px; color:var(--gold); }
  .status { position:absolute; top:46px; left:16px; z-index:5; color:var(--mute); font-size:13px; }
  .robot-wrap { position:absolute; left:50%; top:40%; transform:translate(-50%,-50%); width:min(74vw,320px); z-index:2; }
  .ring { position:absolute; inset:-8%; border-radius:50%; border:1px solid rgba(212,168,67,.35); }
  .robot { width:100%; border-radius:28px; display:block; }
  .listen .ring { animation:pulse 1.2s ease-in-out infinite; border-color:#7dcea0; }
  .speak .ring { animation:pulse .7s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.05); box-shadow:0 0 50px rgba(212,168,67,.4); } }
  .heard { position:absolute; left:50%; top:66%; transform:translateX(-50%); width:min(88vw,420px); text-align:center; color:var(--gold); font-size:14px; z-index:4; min-height:20px; }
  .bubble { position:absolute; left:50%; top:72%; transform:translateX(-50%); width:min(88vw,420px); z-index:4; background:rgba(10,10,14,.8); border:1px solid rgba(212,168,67,.28); border-radius:16px; padding:12px 14px; font-size:16px; line-height:1.4; }
  .talk { position:absolute; left:50%; bottom:28px; transform:translateX(-50%); z-index:6; width:148px; height:148px; border-radius:50%; border:1px solid rgba(212,168,67,.5); background:radial-gradient(circle at 40% 35%, #2a2418, #101014 70%); color:#f0d78c; letter-spacing:.12em; font-size:13px; }
  .talk.on { box-shadow:0 0 0 12px rgba(125,206,160,.15); color:#fff; }
  .card { position:absolute; width:132px; z-index:3; transition:left .7s ease, top .7s ease; }
  .card img { width:100%; border-radius:12px; }
  .card span { display:block; text-align:center; color:var(--gold); font-size:11px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <header><div class="mark">JARVIS</div></header>
  <div class="status" id="status">Appuie une fois. Ensuite tu parles, je réponds.</div>
  <div class="robot-wrap" id="bot"><div class="ring"></div><img class="robot" src="https://raw.githubusercontent.com/16madina/jarvis-test/main/assets/robot.jpg" alt="Jarvis"></div>
  <div class="heard" id="heard"></div>
  <div class="bubble" id="reply">Je t’écoute dès que tu lances la conversation.</div>
  <button class="talk" id="talk" type="button">PARLER</button>
</div>
<script>
const $ = (id) => document.getElementById(id);
const WMO = {0:"ciel dégagé",1:"plutôt dégagé",2:"partiellement nuageux",3:"couvert",45:"brume",48:"brouillard",51:"bruine",61:"pluie",63:"pluie",65:"forte pluie",71:"neige",80:"averses",95:"orage"};
let session = false, rec = null, busy = false, queue = "";
const CARDS = [
  ["mail","https://raw.githubusercontent.com/16madina/jarvis-test/main/assets/mail.jpg","Courriels",8,18],
  ["meteo","https://raw.githubusercontent.com/16madina/jarvis-test/main/assets/prix.jpg","Météo",64,18],
  ["rappel","https://raw.githubusercontent.com/16madina/jarvis-test/main/assets/rappel.jpg","Rappel",22,56]
];
CARDS.forEach(([id,src,label,x,y]) => {
  const el = document.createElement("figure");
  el.className = "card"; el.id = id; el.style.left = x+"%"; el.style.top = y+"%";
  el.innerHTML = "<img src='"+src+"' alt=''><span>"+label+"</span>";
  $("stage").appendChild(el);
});
function move(id, x, y) { const el = $(id); if (!el) return; el.style.left = x+"%"; el.style.top = y+"%"; }
function say(text) {
  $("reply").textContent = text;
  $("bot").classList.remove("listen");
  $("bot").classList.add("speak");
  return new Promise((resolve) => {
    if (!window.speechSynthesis) { setTimeout(resolve, 800); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR"; u.rate = 1.02;
    u.onend = resolve; u.onerror = resolve;
    window.speechSynthesis.speak(u);
  }).finally(() => $("bot").classList.remove("speak"));
}
async function weather() {
  move("meteo", 58, 24);
  const url = "https://api.open-meteo.com/v1/forecast?latitude=45.53&longitude=-73.52&current=temperature_2m,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min&timezone=America/Toronto";
  const data = await fetch(url).then(r => r.json());
  const c = data.current, sky = WMO[c.weather_code] || "temps variable";
  return "Au Québec, autour de Longueuil, il fait "+Math.round(c.temperature_2m)+" degrés, "+sky+", vent "+Math.round(c.wind_speed_10m)+" kilomètres heure. Aujourd’hui, de "+Math.round(data.daily.temperature_2m_min[0])+" à "+Math.round(data.daily.temperature_2m_max[0])+" degrés.";
}
async function answer(text) {
  const t = text.toLowerCase();
  if (/météo|meteo|temps qu'il fait|quel temps|température|temperature/.test(t)) return weather();
  if (/courriel|e-?mail|boîte|boite|mail/.test(t)) {
    move("mail", 10, 22);
    return "Je ne vois pas encore ta boîte courriel. Branche Gmail ou Outlook, et je pourrai te dire combien de messages sont arrivés. Le reste, je peux le faire maintenant.";
  }
  if (/rappel|note/.test(t)) { move("rappel", 30, 54); return "Rappel noté. Dis-moi l’heure si tu veux que je le fixe."; }
  if (/qui es-tu|comment tu|jarvis/.test(t)) return "Je suis Jarvis. Tu parles, j’écoute, je réponds. Pas besoin d’envoyer.";
  return "J’ai entendu : "+text+". Je peux te donner la météo du Québec tout de suite. Pour les courriels, il me faut ta boîte reliée.";
}
async function handle(text) {
  if (!text || busy) { if (text) queue = text; return; }
  busy = true;
  if (rec) { try { rec.stop(); } catch (e) {} }
  $("heard").textContent = text;
  const reply = await answer(text);
  await say(reply);
  busy = false;
  const next = queue; queue = "";
  if (session) startEar();
  if (next) handle(next);
}
function startEar() {
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Rec) { $("status").textContent = "Ce navigateur n’écoute pas. Ouvre dans Safari."; return; }
  rec = new Rec();
  rec.lang = "fr-FR";
  rec.continuous = true;
  rec.interimResults = true;
  rec.onstart = () => { $("bot").classList.add("listen"); $("status").textContent = "J’écoute. Parle, je réponds tout seul."; };
  rec.onresult = (e) => {
    let interim = "", finalText = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const bit = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += bit; else interim += bit;
    }
    $("heard").textContent = finalText || interim;
    if (finalText.trim()) handle(finalText.trim());
  };
  rec.onerror = () => { if (session && !busy) setTimeout(startEar, 400); };
  rec.onend = () => { if (session && !busy) startEar(); };
  rec.start();
}
$("talk").onclick = async () => {
  if (session) {
    session = false;
    if (rec) rec.stop();
    window.speechSynthesis && window.speechSynthesis.cancel();
    $("talk").classList.remove("on");
    $("talk").textContent = "PARLER";
    $("bot").classList.remove("listen");
    $("status").textContent = "Conversation coupée.";
    return;
  }
  session = true;
  $("talk").classList.add("on");
  $("talk").textContent = "STOP";
  await say("Je t’écoute.");
  startEar();
};
</script>
</body>
</html>
